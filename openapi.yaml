openapi: 3.0.3
info:
  title: FlowGate Local API
  description: |
    FlowGate VPN 客户端本地 RESTful API。
    运行在 Android 设备 127.0.0.1:19840，供 Flutter UI、AI Agent、MCP Server 平等调用。
  version: 1.0.0
  contact:
    name: pittosporum-seu
    url: https://github.com/pittosporum-seu/flowgate

servers:
  - url: http://127.0.0.1:19840/api/v1
    description: Android 本地 API Server (Ktor CIO)

paths:
  /health:
    get:
      summary: 健康检查
      operationId: healthCheck
      tags: [System]
      responses:
        '200':
          description: Server 运行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /vpn/status:
    get:
      summary: 获取 VPN 连接状态
      operationId: getVpnStatus
      tags: [VPN]
      responses:
        '200':
          description: 当前状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VpnStatus'

  /vpn/start:
    post:
      summary: 启动 VPN 连接
      operationId: startVpn
      tags: [VPN]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nodeId:
                  type: string
                  description: 节点 ID（可选，使用已选节点）
                config:
                  type: string
                  description: 完整 Xray JSON 配置
                remark:
                  type: string
                  description: 连接备注名
                proxyOnly:
                  type: boolean
                  default: false
                  description: 仅代理模式（不启用 TUN）
      responses:
        '200':
          description: 启动指令已下发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /vpn/stop:
    post:
      summary: 停止 VPN 连接
      operationId: stopVpn
      tags: [VPN]
      responses:
        '200':
          description: 停止指令已下发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /vpn/events:
    get:
      summary: SSE 实时事件流
      operationId: vpnEvents
      tags: [VPN]
      description: |
        Server-Sent Events 端点，推送事件类型：
        - state-change: VPN 状态变化
        - traffic: 流量统计（每秒）
        - test-progress: 批量测速进度
        - test-complete: 测速完成
        - command: 控制指令
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string

  /nodes:
    get:
      summary: 列出所有节点
      operationId: listNodes
      tags: [Nodes]
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/Node'
                          total:
                            type: integer
    post:
      summary: 添加单个节点
      operationId: addNode
      tags: [Nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '201':
          description: 节点已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /nodes/{id}:
    get:
      summary: 获取节点详情
      operationId: getNode
      tags: [Nodes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 节点详情
        '404':
          description: 节点不存在
    delete:
      summary: 删除节点
      operationId: deleteNode
      tags: [Nodes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 已删除

  /nodes/import:
    post:
      summary: 批量导入节点
      operationId: importNodes
      tags: [Nodes]
      description: 支持 base64 编码的分享链接、原始链接文本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: 导入内容（base64/原始链接）
                type:
                  type: string
                  enum: [base64, url, raw]
                  description: 内容类型（null 自动检测）
                subscriptionId:
                  type: string
                  description: 关联订阅 ID
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          imported:
                            type: integer
                          nodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/Node'

  /nodes/{id}/test:
    post:
      summary: 测试单节点延迟
      operationId: testNode
      tags: [Nodes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 测速结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/NodeTestResult'

  /nodes/test-all:
    post:
      summary: 批量测速（异步）
      operationId: testAllNodes
      tags: [Nodes]
      responses:
        '200':
          description: 任务已启动
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          taskId:
                            type: string
                          total:
                            type: integer

  /nodes/test-all/{taskId}:
    get:
      summary: 查询批量测速进度
      operationId: getTestProgress
      tags: [Nodes]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 测速进度
        '404':
          description: 任务不存在或已过期

  /subscriptions:
    get:
      summary: 列出所有订阅
      operationId: listSubscriptions
      tags: [Subscriptions]
      responses:
        '200':
          description: 订阅列表
    post:
      summary: 添加订阅
      operationId: addSubscription
      tags: [Subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name:
                  type: string
                url:
                  type: string
                autoUpdate:
                  type: boolean
                  default: false
                updateIntervalHours:
                  type: integer
                  default: 24
      responses:
        '201':
          description: 订阅已创建

  /subscriptions/{id}:
    get:
      summary: 获取订阅详情
      operationId: getSubscription
      tags: [Subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 订阅详情
    put:
      summary: 更新订阅设置
      operationId: updateSubscription
      tags: [Subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                autoUpdate:
                  type: boolean
                updateIntervalHours:
                  type: integer
      responses:
        '200':
          description: 已更新
    delete:
      summary: 删除订阅
      operationId: deleteSubscription
      tags: [Subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: deleteNodes
          in: query
          schema:
            type: boolean
            default: false
          description: 是否同时删除关联节点
      responses:
        '200':
          description: 已删除

  /subscriptions/{id}/update:
    post:
      summary: 手动刷新订阅
      operationId: refreshSubscription
      tags: [Subscriptions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 刷新结果

  /routing:
    get:
      summary: 获取路由规则
      operationId: getRouting
      tags: [Routing]
      responses:
        '200':
          description: 当前路由配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/RoutingRules'
    put:
      summary: 更新路由规则（支持部分更新）
      operationId: updateRouting
      tags: [Routing]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingUpdate'
      responses:
        '200':
          description: 已更新

  /system/info:
    get:
      summary: 系统信息
      operationId: getSystemInfo
      tags: [System]
      responses:
        '200':
          description: 版本/平台/端口信息

  /system/logs:
    get:
      summary: 获取最近日志
      operationId: getLogs
      tags: [System]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: 日志条目列表

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          nullable: true
        error:
          type: string
          nullable: true

    VpnStatus:
      type: object
      properties:
        state:
          type: string
          enum: [connected, connecting, disconnected, disconnecting]
        duration:
          type: string
          example: "01:23:45"
        uploadSpeed:
          type: integer
          format: int64
        downloadSpeed:
          type: integer
          format: int64
        uploadTotal:
          type: integer
          format: int64
        downloadTotal:
          type: integer
          format: int64
        nodeId:
          type: string
          nullable: true
        nodeName:
          type: string
          nullable: true

    Node:
      type: object
      required: [id, name, type, server, port]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [vmess, vless, trojan, shadowsocks, socks, hysteria2]
        server:
          type: string
        port:
          type: integer
        password:
          type: string
        method:
          type: string
          nullable: true
        sni:
          type: string
          nullable: true
        alpn:
          type: string
          nullable: true
        network:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
        allowInsecure:
          type: boolean
        subscriptionId:
          type: string
          nullable: true
        latencyMs:
          type: integer
          nullable: true
        createdAt:
          type: integer
          format: int64
        rawConfig:
          type: string
          nullable: true

    NodeTestResult:
      type: object
      properties:
        nodeId:
          type: string
        delay:
          type: integer
          nullable: true
          description: 延迟 ms（null 表示失败）
        error:
          type: string
          nullable: true

    RoutingRules:
      type: object
      properties:
        domainStrategy:
          type: string
          enum: [AsIs, IPIfNonMatch, IPOnDemand]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRule'
        bypassLan:
          type: boolean
        bypassChina:
          type: boolean
        proxyDomains:
          type: array
          items:
            type: string
        directDomains:
          type: array
          items:
            type: string

    RoutingRule:
      type: object
      required: [id, outboundTag]
      properties:
        id:
          type: string
        type:
          type: string
          default: field
        outboundTag:
          type: string
          enum: [proxy, direct, block]
        domain:
          type: array
          items:
            type: string
        ip:
          type: array
          items:
            type: string
        port:
          type: string
          nullable: true
        enabled:
          type: boolean
        priority:
          type: integer

    RoutingUpdate:
      type: object
      description: 部分更新，仅传需要修改的字段
      properties:
        domainStrategy:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRule'
        bypassLan:
          type: boolean
        bypassChina:
          type: boolean
        proxyDomains:
          type: array
          items:
            type: string
        directDomains:
          type: array
          items:
            type: string
