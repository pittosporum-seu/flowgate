# 订阅相关数据模型

Subscription:
  type: object
  required: [id, name, url]
  properties:
    id:
      type: string
      description: 唯一标识
    name:
      type: string
      description: 订阅名称
    url:
      type: string
      description: 订阅链接
    autoUpdate:
      type: boolean
      default: false
      description: 是否自动更新
    updateIntervalHours:
      type: integer
      default: 24
      description: 自动更新间隔（小时）
    lastUpdated:
      type: integer
      format: int64
      nullable: true
      description: 上次更新时间戳 (epoch ms)
    nodeCount:
      type: integer
      default: 0
      description: 关联节点数量
    trafficUsed:
      type: integer
      format: int64
      nullable: true
      description: 已用流量 (bytes)
    trafficTotal:
      type: integer
      format: int64
      nullable: true
      description: 总流量 (bytes)
    expireAt:
      type: integer
      format: int64
      nullable: true
      description: 到期时间戳 (epoch ms)
    createdAt:
      type: integer
      format: int64
      description: 创建时间戳 (epoch ms)

SubscriptionCreateRequest:
  type: object
  required: [name, url]
  properties:
    name:
      type: string
      description: 订阅名称
    url:
      type: string
      description: 订阅链接
    autoUpdate:
      type: boolean
      default: false
    updateIntervalHours:
      type: integer
      default: 24

SubscriptionUpdateRequest:
  type: object
  description: 部分更新，仅传需要修改的字段
  properties:
    name:
      type: string
    url:
      type: string
    autoUpdate:
      type: boolean
    updateIntervalHours:
      type: integer

SubscriptionRefreshResult:
  type: object
  properties:
    added:
      type: integer
      description: 新增节点数
    updated:
      type: integer
      description: 更新节点数
    removed:
      type: integer
      description: 移除节点数
