# VPN 控制端点

/vpn/status:
  get:
    summary: 获取 VPN 连接状态
    operationId: getVpnStatus
    tags: [VPN]
    responses:
      '200':
        description: 当前状态
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/ApiResponse'
                - properties:
                    data:
                      $ref: '../schemas/vpn.yaml#/VpnStatus'

/vpn/start:
  post:
    summary: 启动 VPN 连接
    operationId: startVpn
    tags: [VPN]
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../schemas/vpn.yaml#/VpnStartRequest'
    responses:
      '200':
        description: 启动指令已下发
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiResponse'

/vpn/stop:
  post:
    summary: 停止 VPN 连接
    operationId: stopVpn
    tags: [VPN]
    responses:
      '200':
        description: 停止指令已下发
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ApiResponse'

/vpn/events:
  get:
    summary: SSE 实时事件流
    operationId: vpnEvents
    tags: [VPN]
    description: |
      Server-Sent Events 端点，推送事件类型：
      - state-change: VPN 状态变化
      - traffic: 流量统计（每秒）
      - test-progress: 批量测速进度
      - test-complete: 测速完成
      - command: 控制指令
    responses:
      '200':
        description: SSE 事件流
        content:
          text/event-stream:
            schema:
              $ref: '../schemas/vpn.yaml#/SseEvent'
