# 公共路径参数

PathId:
  name: id
  in: path
  required: true
  schema:
    type: string
  description: 资源唯一标识

PathTaskId:
  name: taskId
  in: path
  required: true
  schema:
    type: string
  description: 异步任务 ID

QueryLimit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    default: 100
    minimum: 1
    maximum: 1000
  description: 返回条目数上限

QueryDeleteNodes:
  name: deleteNodes
  in: query
  required: false
  schema:
    type: boolean
    default: false
  description: 是否同时删除关联节点
